name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GitHub statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          from pathlib import Path

          username = "surakshyamagar"
          token = os.environ["GITHUB_TOKEN"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "GitHub-Profile-Stats"
          }

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode())

          def graphql(query, variables):
              data = json.dumps({
                  "query": query,
                  "variables": variables
              }).encode("utf-8")

              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=data,
                  headers={
                      **headers,
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request) as response:
                  result = json.loads(response.read().decode())

              if "errors" in result:
                  raise Exception(
                      "GitHub GraphQL error: "
                      + json.dumps(result["errors"])
                  )

              return result["data"]

          user = get_json(
              f"https://api.github.com/users/{username}"
          )

          repositories = get_json(
              f"https://api.github.com/users/{username}/repos"
              "?per_page=100&type=owner"
          )

          public_repositories = [
              repo for repo in repositories
              if not repo.get("fork", False)
          ]

          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in public_repositories
          )

          forks = sum(
              repo.get("forks_count", 0)
              for repo in public_repositories
          )

          def search_count(query):
              encoded = urllib.parse.quote(query)

              data = get_json(
                  "https://api.github.com/search/issues?q="
                  + encoded
              )

              return data.get("total_count", 0)

          pull_requests = search_count(
              f"author:{username} is:pr"
          )

          issues = search_count(
              f"author:{username} is:issue"
          )

          contribution_query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                }
              }
            }
          }
          """

          contribution_data = graphql(
              contribution_query,
              {"login": username}
          )

          contributions = (
              contribution_data["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
              ["totalContributions"]
          )

          stats = f"""<!-- GITHUB_STATS_START -->
          <p align="center">
            <b>📦 {len(public_repositories)} Public Repositories</b>
            &nbsp;&nbsp;•&nbsp;&nbsp;
            <b>⭐ {stars} Stars</b>
            &nbsp;&nbsp;•&nbsp;&nbsp;
            <b>👥 {user.get("followers", 0)} Followers</b>
            &nbsp;&nbsp;•&nbsp;&nbsp;
            <b>👤 {user.get("following", 0)} Following</b>
          </p>

          <p align="center">
            <b>📝 {contributions} Contributions</b>
            &nbsp;&nbsp;•&nbsp;&nbsp;
            <b>🔀 {pull_requests} Pull Requests</b>
            &nbsp;&nbsp;•&nbsp;&nbsp;
            <b>🐛 {issues} Issues</b>
            &nbsp;&nbsp;•&nbsp;&nbsp;
            <b>🍴 {forks} Forks</b>
          </p>

          <p align="center">
            <sub>Automatically updated from GitHub</sub>
          </p>
          <!-- GITHUB_STATS_END -->"""

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")

          start_marker = "<!-- GITHUB_STATS_START -->"
          end_marker = "<!-- GITHUB_STATS_END -->"

          start = readme.find(start_marker)
          end = readme.find(end_marker)

          if start == -1 or end == -1:
              raise Exception(
                  "GitHub statistics markers not found in README.md"
              )

          end += len(end_marker)

          updated_readme = (
              readme[:start]
              + stats
              + readme[end:]
          )

          readme_path.write_text(
              updated_readme,
              encoding="utf-8"
          )

          print("Statistics updated:")
          print(f"Public repositories: {len(public_repositories)}")
          print(f"Stars: {stars}")
          print(f"Followers: {user.get('followers', 0)}")
          print(f"Following: {user.get('following', 0)}")
          print(f"Contributions: {contributions}")
          print(f"Pull Requests: {pull_requests}")
          print(f"Issues: {issues}")
          print(f"Forks: {forks}")
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git diff --cached --quiet || git commit -m "Update GitHub profile stats"

          git push
